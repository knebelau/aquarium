<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aquarium</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
        width: 100%; height: 100%;
        overflow: hidden;
        background: #082f52;
        font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    }
    #aquarium {
        position: fixed; inset: 0;
        display: block;
        cursor: pointer;
        touch-action: none;
    }
    .hud {
        position: fixed; top: 0; left: 0; right: 0;
        display: flex; justify-content: space-between; align-items: flex-start;
        padding: 22px 28px;
        pointer-events: none;
        z-index: 10;
    }
    .brand {
        display: flex; align-items: center; gap: 12px;
        background: rgba(6, 32, 54, 0.45);
        border: 1px solid rgba(255,255,255,0.18);
        border-radius: 16px;
        padding: 12px 20px;
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        box-shadow: 0 8px 32px rgba(0, 10, 25, 0.35);
    }
    .brand .fish-icon {
        font-size: 30px; line-height: 1;
        filter: drop-shadow(0 2px 4px rgba(0,0,0,0.4));
        animation: bob 3s ease-in-out infinite;
    }
    @keyframes bob {
        0%, 100% { transform: translateY(0) rotate(-6deg); }
        50% { transform: translateY(-5px) rotate(6deg); }
    }
    .brand h1 {
        color: #eaf7ff;
        font-size: 22px;
        font-weight: 600;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        text-shadow: 0 2px 8px rgba(0, 20, 40, 0.6);
    }
    .brand p {
        color: rgba(214, 238, 250, 0.85);
        font-size: 12px;
        letter-spacing: 0.05em;
        margin-top: 2px;
    }
    .hint {
        background: rgba(6, 32, 54, 0.45);
        border: 1px solid rgba(255,255,255,0.18);
        border-radius: 999px;
        padding: 10px 18px;
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        color: #d8effc;
        font-size: 13px;
        letter-spacing: 0.04em;
        box-shadow: 0 8px 32px rgba(0, 10, 25, 0.35);
        animation: pulse 2.6s ease-in-out infinite;
    }
    @keyframes pulse {
        0%, 100% { opacity: 0.95; }
        50% { opacity: 0.65; }
    }
    .hint .dot {
        display: inline-block; width: 8px; height: 8px; border-radius: 50%;
        background: #ffd76a; margin-right: 8px;
        box-shadow: 0 0 8px #ffd76a;
        animation: blink 1.4s ease-in-out infinite;
    }
    @keyframes blink { 0%, 100% { transform: scale(1); } 50% { transform: scale(0.6); } }
</style>
</head>
<body>
<canvas id="aquarium"></canvas>
<div class="hud">
    <div class="brand">
        <div class="fish-icon">🐟</div>
        <div>
            <h1>Aquarium</h1>
            <p>Rust &amp; WebAssembly</p>
        </div>
    </div>
    <div class="hint"><span class="dot"></span>Klick ins Wasser – die Fische kommen fressen</div>
</div>
<script type="module">
    import init from './pkg/aquarium.js';
    await init();
</script>
</body>
</html>
