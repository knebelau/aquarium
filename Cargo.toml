[package]
name = "aquarium"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
  "CanvasRenderingContext2d",
  "CanvasGradient",
  "HtmlCanvasElement",
  "Window",
  "Document",
  "Element",
  "MouseEvent",
  "HtmlElement",
] }
js-sys = "0.3"

[profile.release]
opt-level = 3
